name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests (math only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --no-default-features --features pg16 -- -D warnings
      - name: Unit tests
        run: cargo test --no-default-features --features pg16 --lib unit_tests

  pgrx:
    name: pgrx test (pg${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17]
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ matrix.pg }} build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libreadline-dev zlib1g-dev flex bison \
            libxml2-dev libxslt-dev libssl-dev libxml2-utils xsltproc \
            ccache pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pgrx-${{ matrix.pg }}

      - name: Install cargo-pgrx
        run: cargo install --locked cargo-pgrx --version 0.13.1

      - name: Cache pgrx install
        id: pgrx-cache
        uses: actions/cache@v4
        with:
          path: ~/.pgrx
          key: pgrx-${{ matrix.pg }}-${{ runner.os }}-v1

      - name: pgrx init (build pg${{ matrix.pg }} from source)
        if: steps.pgrx-cache.outputs.cache-hit != 'true'
        run: cargo pgrx init --pg${{ matrix.pg }} download

      - name: pgrx init (use cached postgres)
        if: steps.pgrx-cache.outputs.cache-hit == 'true'
        run: cargo pgrx init --pg${{ matrix.pg }} ~/.pgrx/${{ matrix.pg }}.*/bin/pg_config

      - name: Run pg_test integration tests
        run: cargo pgrx test pg${{ matrix.pg }}
