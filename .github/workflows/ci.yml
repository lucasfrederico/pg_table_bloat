name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  pgrx:
    name: pg${{ matrix.pg }} (clippy + unit + integration)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17]
    steps:
      - uses: actions/checkout@v4

      - name: Install Postgres build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libreadline-dev zlib1g-dev flex bison \
            libxml2-dev libxslt-dev libssl-dev libxml2-utils xsltproc \
            ccache pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pgrx-${{ matrix.pg }}

      - name: Install cargo-pgrx
        run: cargo install --locked cargo-pgrx --version 0.13.1

      - name: Cache pgrx home
        id: pgrx-cache
        uses: actions/cache@v4
        with:
          path: ~/.pgrx
          key: pgrx-home-${{ matrix.pg }}-${{ runner.os }}-v1

      - name: pgrx init (build Postgres ${{ matrix.pg }})
        if: steps.pgrx-cache.outputs.cache-hit != 'true'
        run: cargo pgrx init --pg${{ matrix.pg }} download

      # When the cache was hit, the toolchain dir exists but pgrx still
      # needs to know where pg_config lives. Use a glob to find it.
      - name: pgrx init (use cached Postgres)
        if: steps.pgrx-cache.outputs.cache-hit == 'true'
        run: |
          PG_CONFIG=$(find ~/.pgrx -name pg_config -path "*${{ matrix.pg }}*" | head -1)
          cargo pgrx init --pg${{ matrix.pg }} "$PG_CONFIG"

      - name: clippy
        run: cargo clippy --no-default-features --features pg${{ matrix.pg }} -- -D warnings

      - name: Unit tests (pure math)
        run: cargo test --no-default-features --features pg${{ matrix.pg }} --lib unit_tests

      - name: pg_test integration tests
        run: cargo pgrx test pg${{ matrix.pg }}
